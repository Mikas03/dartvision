name: Tests und Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python-Prototyp testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # headless-Variante von OpenCV, da auf dem Server kein Bildschirm vorhanden ist
      - run: pip install opencv-python-headless numpy pytest && pip install -e . --no-deps
      - run: pytest -q

  server:
    name: Server-Regeln prüfen
    runs-on: ubuntu-latest
    env:
      PB_VERSION: 0.40.6
      PB_SHA256: 0e1f609158ed945f809f8a02ae012aa0427129c66ebb63c1aee76f2c0309373f
    steps:
      - uses: actions/checkout@v4
      - name: PocketBase laden (mit Prüfsumme)
        run: |
          curl -sSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          echo "${PB_SHA256}  pb.zip" | sha256sum -c
          unzip -q pb.zip pocketbase
      - name: Datenbank anlegen und Server starten
        run: |
          ./pocketbase migrate up --dir=pb_data --migrationsDir=server/pb_migrations
          ./pocketbase serve --http=127.0.0.1:8090 --dir=pb_data --migrationsDir=server/pb_migrations &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 0.5; done
      - name: Zugriffsregeln prüfen
        run: python3 server/test_rules.py

  app:
    name: App testen und bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /dartvision/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    name: Auf GitHub Pages veröffentlichen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [python, server, app]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
